[package]
name = "madori-viewer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
madori-display.workspace = true
solidcraft-geom.workspace = true
solidcraft-viewport.workspace = true
solidcraft-viewport-gpu.workspace = true
wasm-bindgen.workspace = true
wgpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys.workspace = true
js-sys.workspace = true
wasm-bindgen-futures.workspace = true

[package.metadata.cargo-machete]
# Enables the WebGPU backend on SolidCraft's shared wgpu dependency.
ignored = ["wgpu"]
