name: check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mode:
    runs-on: [self-hosted, madori-light]
    timeout-minutes: 10
    outputs:
      flag: ${{ steps.select.outputs.flag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          set-safe-directory: false
      - id: select
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          flag=$(git diff --no-renames --name-only -z "$BASE...HEAD" | node scripts/check/ci-mode.ts)
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
  check:
    needs: mode
    runs-on:
      [self-hosted, "${{ needs.mode.outputs.flag == '--full' && 'madori' || 'madori-light' }}"]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # The upstream boundary check reads the recorded upstream commit from history.
          fetch-depth: 0
          # The runner user owns the workspace; a safe.directory entry would land in the symlinked ~/.gitconfig.
          set-safe-directory: false
      # The checkout starts clean each run; keep only Rust and tool build outputs between runs.
      - run: |
          cache="$RUNNER_TOOL_CACHE/madori"
          mkdir -p "$cache/target" "$cache/tools"
          ln -s "$cache/target" target
          ln -s "$cache/tools" .tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup
        if: ${{ needs.mode.outputs.flag != '--docs' }}
      - name: pnpm check ${{ needs.mode.outputs.flag }}
        run: pnpm check ${FLAG:+"$FLAG"}
        env:
          FLAG: ${{ needs.mode.outputs.flag }}
          MADORI_TEST_RESULTS_DIR: ${{ runner.temp }}/test-results
      - if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: test-results-v1-${{ github.workflow }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/
          retention-days: 30
          if-no-files-found: ignore
      # pnpm check autofixes; a diff means the pushed head was not checked as committed.
      - run: git diff --exit-code
