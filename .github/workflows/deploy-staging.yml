name: deploy-staging
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Never cancel a deploy midway; a newer push waits and then deploys the latest main.
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, madori]
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: 4a67230af28ec94d9c70ca48572d8e9f
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          cache="$RUNNER_TOOL_CACHE/madori"
          mkdir -p "$cache/target" "$cache/tools"
          ln -s "$cache/target" target
          ln -s "$cache/tools" .tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup
      # Merged heads can differ from every checked PR head, and --full builds the web assets.
      - run: pnpm check --full
      # Credentials come from the runner's MADORI_ENV_FILE (README: PRの検査); read only what each step needs.
      - name: Migrate and deploy
        working-directory: apps/worker
        run: |
          CLOUDFLARE_API_TOKEN="$(sed -n 's/^CLOUDFLARE_API_TOKEN=//p' "$MADORI_ENV_FILE")"
          export CLOUDFLARE_API_TOKEN
          # The launchd runner cannot use the macOS keychain, so registry login must not go
          # through Docker Desktop's credsStore. RUNNER_TEMP is emptied at the end of the job.
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          mkdir -p "$DOCKER_CONFIG"
          for entry in contexts cli-plugins buildx; do ln -sfn "$HOME/.docker/$entry" "$DOCKER_CONFIG/$entry"; done
          jq '{currentContext}' "$HOME/.docker/config.json" > "$DOCKER_CONFIG/config.json"
          pnpm exec wrangler d1 migrations apply DB --remote --env staging
          pnpm exec wrangler deploy --env staging
      - name: Smoke test through Access
        run: |
          STAGING_ACCESS_CLIENT_ID="$(sed -n 's/^STAGING_ACCESS_CLIENT_ID=//p' "$MADORI_ENV_FILE")"
          STAGING_ACCESS_CLIENT_SECRET="$(sed -n 's/^STAGING_ACCESS_CLIENT_SECRET=//p' "$MADORI_ENV_FILE")"
          export STAGING_ACCESS_CLIENT_ID STAGING_ACCESS_CLIENT_SECRET
          node scripts/check/staging-smoke.ts
