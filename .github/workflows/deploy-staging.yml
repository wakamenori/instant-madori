name: deploy-staging
on:
  push:
    branches: [main]
    # Paths that no deploy input reads (README: stagingへデプロイする).
    paths-ignore:
      - ".claude/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
      - "metrics/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
# Never cancel a running deploy; a newer run replaces the one pending run and later deploys its own commit.
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, madori]
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: 4a67230af28ec94d9c70ca48572d8e9f
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The runner user owns the workspace; a safe.directory entry would land in the symlinked ~/.gitconfig.
          set-safe-directory: false
      - id: migration-base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Staging D1 records migrations by file name, so branches may carry only migrations main has deployed.
      - if: github.ref != 'refs/heads/main'
        env:
          MADORI_MIGRATION_BASE: ${{ steps.migration-base.outputs.sha }}
        run: node scripts/check/check-migrations.ts --branch-deploy
      - run: |
          cache="$RUNNER_TOOL_CACHE/madori"
          mkdir -p "$cache/target" "$cache/tools"
          ln -s "$cache/target" target
          ln -s "$cache/tools" .tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup
      # Merged heads can differ from every checked PR head, and --full builds the web assets.
      - run: pnpm check --full
        env:
          MADORI_MIGRATION_BASE: ${{ github.ref == 'refs/heads/main' && steps.migration-base.outputs.sha || '' }}
          MADORI_TEST_RESULTS_DIR: ${{ runner.temp }}/test-results
      - if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: test-results-v1-${{ github.workflow }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/
          retention-days: 30
          if-no-files-found: ignore
      # Credentials come from the runner's MADORI_ENV_FILE (README: PRの検査); read only what each step needs.
      - name: Migrate and deploy
        working-directory: apps/worker
        run: |
          CLOUDFLARE_API_TOKEN="$(sed -n 's/^CLOUDFLARE_API_TOKEN=//p' "$MADORI_ENV_FILE")"
          export CLOUDFLARE_API_TOKEN
          # The launchd runner cannot use the macOS keychain, so registry login must store its
          # credentials in this job's config file. Docker picks the keychain helper by itself when
          # a config holds no credsStore and no auths, so the config starts with a placeholder auth.
          # RUNNER_TEMP is emptied at the end of the job.
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          mkdir -p "$DOCKER_CONFIG"
          for entry in contexts cli-plugins buildx; do ln -sfn "$HOME/.docker/$entry" "$DOCKER_CONFIG/$entry"; done
          jq '{currentContext, auths: {"placeholder.invalid": {}}}' "$HOME/.docker/config.json" > "$DOCKER_CONFIG/config.json"
          STAGING_ACCESS_CLIENT_ID="$(sed -n 's/^STAGING_ACCESS_CLIENT_ID=//p' "$MADORI_ENV_FILE")"
          if [ -z "$(printf '%s' "$STAGING_ACCESS_CLIENT_ID" | tr -d '[:space:]')" ]; then
            echo "STAGING_ACCESS_CLIENT_ID must not be empty" >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "$STAGING_ACCESS_CLIENT_ID"
          pnpm exec wrangler d1 migrations apply DB --remote --env staging
          set -- --env staging --var "ACCESS_VERIFIER_CLIENT_ID:$STAGING_ACCESS_CLIENT_ID"
          STAGING_AI_ACCESS_CLIENT_ID="$(sed -n 's/^STAGING_AI_ACCESS_CLIENT_ID=//p' "$MADORI_ENV_FILE")"
          if [ -n "$(printf '%s' "$STAGING_AI_ACCESS_CLIENT_ID" | tr -d '[:space:]')" ]; then
            printf '::add-mask::%s\n' "$STAGING_AI_ACCESS_CLIENT_ID"
            set -- "$@" --var "ACCESS_AI_VERIFIER_CLIENT_ID:$STAGING_AI_ACCESS_CLIENT_ID"
          fi
          pnpm exec node ../../scripts/deploy/wrangler-deploy.ts "$@"
      - name: Smoke test through Access
        run: |
          STAGING_ACCESS_CLIENT_ID="$(sed -n 's/^STAGING_ACCESS_CLIENT_ID=//p' "$MADORI_ENV_FILE")"
          STAGING_ACCESS_CLIENT_SECRET="$(sed -n 's/^STAGING_ACCESS_CLIENT_SECRET=//p' "$MADORI_ENV_FILE")"
          printf '::add-mask::%s\n' "$STAGING_ACCESS_CLIENT_ID"
          printf '::add-mask::%s\n' "$STAGING_ACCESS_CLIENT_SECRET"
          export STAGING_ACCESS_CLIENT_ID STAGING_ACCESS_CLIENT_SECRET
          node scripts/check/staging-smoke.ts
      - name: Check R2 create-only writes on Cloudflare
        run: |
          CLOUDFLARE_API_TOKEN="$(sed -n 's/^CLOUDFLARE_API_TOKEN=//p' "$MADORI_ENV_FILE")"
          export CLOUDFLARE_API_TOKEN
          node scripts/check/r2-create-only/main.ts
      - name: Reclaim old staging registry tags
        run: |
          CLOUDFLARE_API_TOKEN="$(sed -n 's/^CLOUDFLARE_API_TOKEN=//p' "$MADORI_ENV_FILE")"
          export CLOUDFLARE_API_TOKEN
          node scripts/deploy/registry-retention.ts --apply
