[settings]
# Lets mise's PATH entries precede entries a parent process added after mise activation (T3 puts /opt/homebrew/bin there).
activate_aggressive = true

[tools]
node = "26.13.1"
pnpm = "11.9.0"
gitleaks = "8.30.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"
hadolint = "2.15.1"
mbx = { version = "1.30.0", lazy = true, lazy_bins = ["mbx"] }
cargo-deny = "0.20.2"
"cargo:cargo-machete" = "0.9.2"

[env]
# Only rustup's proxies apply rust-toolchain.toml; another cargo (Homebrew rust) lacks the wasm32 std.
_.path = ["{{ env.CARGO_HOME | default(value=env.HOME ~ '/.cargo') }}/bin"]
