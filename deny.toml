[graph]
all-features = false

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "0BSD", "BSL-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
# Upstream uses versionless path dependencies between its workspace crates.
# Cargo.lock pins the actual resolved graph; this is not a registry wildcard policy.
wildcards = "allow"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/tangency-labs/solidcore"]
