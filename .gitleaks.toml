[extend]
useDefault = true

[[allowlists]]
description = "Upstream source and generated/dependency directories are maintained separately."
paths = [
  '''(^|/)third_party/solidcraft(/|$)''',
  '''(^|/)(node_modules|target|\.tools|\.git|\.wrangler|dist)(/|$)''',
  '''(^|/)crates/viewer/pkg(/|$)''',
  '''(^|/)apps/worker/worker-configuration\.d\.ts$''',
]

[[allowlists]]
description = "An Access audience tag is public: Access puts it in the aud claim of every token it hands to the browser."
regexTarget = "match"
regexes = ['''^ACCESS_AUD": "[0-9a-f]{64}"$''']
