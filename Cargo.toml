[workspace]
resolver = "3"
members = ["crates/geometry-api", "crates/display", "apps/geometry", "crates/housing", "crates/modeling", "crates/viewer"]
exclude = ["third_party/solidcraft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
schemars = "=1.2.3"
tower = { version = "0.5", features = ["util"] }
js-sys = "=0.3.106"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"] }
madori-geometry-api = { path = "crates/geometry-api" }
serde = { version = "1", features = ["derive"] }
madori-display = { path = "crates/display" }
madori-housing = { path = "crates/housing" }
madori-modeling = { path = "crates/modeling" }
solidcraft-doc = { path = "third_party/solidcraft/crates/doc" }
solidcraft-engine = { path = "third_party/solidcraft/crates/engine", default-features = false }
solidcraft-geom = { path = "third_party/solidcraft/crates/geom" }
# The upstream cache fingerprint does not describe this workspace's dependency resolution,
# and this repository's HEAD is not a SolidCraft commit, so io's build script reads no git state.
solidcraft-io = { path = "third_party/solidcraft/crates/io", features = ["external-workspace"] }
solidcraft-viewport = { path = "third_party/solidcraft/crates/viewport" }
solidcraft-viewport-gpu = { path = "third_party/solidcraft/crates/viewport-gpu" }
serde_json = { version = "1", features = ["float_roundtrip"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
wasm-bindgen = "=0.2.129"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgpu"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = 0
# CARGO_INCREMENTAL overrides this, and the flag is part of each unit's hash. False keeps unset and =0 runs on one artifact set.
incremental = false

# Rust tests spend most of their time in SolidCraft geometry and in housing's exact arithmetic.
# Optimize every non-proc-macro package under third_party/solidcraft. Other dependencies stay at 0:
# the tests barely run them, and optimizing them (cadmpeg above all) lengthens a cold build.
# Housing at 1 runs its tests as fast as at 2 and rebuilds as fast as at 0.
# Only opt-level changes, so debug assertions and overflow checks stay on in tests.
[profile.dev.package.craft-plugin]
opt-level = 2

[profile.dev.package.solidcore]
opt-level = 2

[profile.dev.package.solidcore-cadir]
opt-level = 2

[profile.dev.package.solidcore-convert]
opt-level = 2

[profile.dev.package.solidcore-ops]
opt-level = 2

[profile.dev.package.solidcore-record]
opt-level = 2

[profile.dev.package.solidcore-step]
opt-level = 2

[profile.dev.package.solidcore-tess]
opt-level = 2

[profile.dev.package.solidcraft-color]
opt-level = 2

[profile.dev.package.solidcraft-control]
opt-level = 2

[profile.dev.package.solidcraft-develop]
opt-level = 2

[profile.dev.package.solidcraft-doc]
opt-level = 2

[profile.dev.package.solidcraft-engine]
opt-level = 2

[profile.dev.package.solidcraft-format]
opt-level = 2

[profile.dev.package.solidcraft-geom]
opt-level = 2

[profile.dev.package.solidcraft-io]
opt-level = 2

[profile.dev.package.solidcraft-kernel]
opt-level = 2

[profile.dev.package.solidcraft-profile]
opt-level = 2

[profile.dev.package.solidcraft-render]
opt-level = 2

[profile.dev.package.solidcraft-sketch]
opt-level = 2

[profile.dev.package.solidcraft-smlib]
opt-level = 2

[profile.dev.package.solidcraft-ui-text]
opt-level = 2

[profile.dev.package.solidcraft-viewport]
opt-level = 2

[profile.dev.package.solidcraft-viewport-gpu]
opt-level = 2

[profile.dev.package.madori-housing]
opt-level = 1

[profile.release]
lto = "thin"

# Upstream patches currently affect only egui/winit, outside the service dependency graph.
# Reassess patches when updating upstream or adding a dependency on its UI.
